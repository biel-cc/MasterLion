<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masterino</title>
    <style>
      :root {
        color-scheme: light dark;
        --brand-color: #151515;
        --brand-muted: rgb(21 21 21 / 28%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --brand-color: #f5f5f5;
          --brand-muted: rgb(245 245 245 / 28%);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        margin: 0;
        overflow: hidden;
        color: var(--brand-color);
        font-family:
          Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
      }

      .drag-bar {
        position: fixed;
        z-index: 1;
        top: 0;
        right: 0;
        left: 0;
        height: 48px;
        -webkit-app-region: drag;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding-top: 24px;
      }

      .wordmark {
        position: relative;
        overflow: hidden;
        font-size: clamp(34px, 6vw, 56px);
        font-weight: 680;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .wordmark::after {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 20%,
          rgb(255 255 255 / 72%) 46%,
          transparent 72%
        );
        content: '';
        transform: translateX(-130%);
        animation: sheen 2.2s ease-in-out infinite;
        mix-blend-mode: difference;
      }

      .progress {
        width: 72px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--brand-muted);
      }

      .progress::after {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: currentcolor;
        content: '';
        animation: loading 1.25s ease-in-out infinite;
      }

      @keyframes sheen {
        0%,
        20% {
          transform: translateX(-130%);
        }

        70%,
        100% {
          transform: translateX(130%);
        }
      }

      @keyframes loading {
        0% {
          transform: translateX(-130%);
        }

        50% {
          transform: translateX(120%);
        }

        100% {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .wordmark::after,
        .progress::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="drag-bar"></div>
    <main class="brand" aria-label="Masterino is starting">
      <div class="wordmark">Masterino</div>
      <div class="progress" aria-hidden="true"></div>
    </main>
  </body>
</html>
