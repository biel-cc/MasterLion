name: Desktop Publish to Alibaba Cloud OSS
description: Upload versioned desktop artifacts before atomically updating canary manifests

inputs:
  access-key-id:
    description: Dedicated RAM AccessKey ID
    required: true
  access-key-secret:
    description: Dedicated RAM AccessKey secret
    required: true
  artifact-name:
    description: Merged GitHub Actions artifact
    required: false
    default: merged-release
  bucket:
    description: OSS bucket
    required: true
  channel:
    description: Desktop update channel
    required: true
  endpoint:
    description: OSS S3-compatible endpoint
    required: true
  key-prefix:
    description: Object key prefix inside the bucket
    required: false
    default: desktop/releases
  public-base-url:
    description: Public URL corresponding to key-prefix
    required: true
  region:
    description: OSS region
    required: true
  release-notes:
    description: Release notes embedded in the signed manifest
    required: false
    default: ''
  signing-private-key-b64:
    description: Base64 encoded Ed25519 PKCS8 private key
    required: true
  version:
    description: Desktop SemVer
    required: true

runs:
  using: composite
  steps:
    - name: Download merged desktop artifacts
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: release

    - name: Prepare and verify release manifests
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        DESKTOP_UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ inputs.signing-private-key-b64 }}
        RELEASE_NOTES: ${{ inputs.release-notes }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        for manifest in "release/${CHANNEL}.yml" "release/${CHANNEL}-mac.yml"; do
          test -f "$manifest"
          sed -i "s|url: |url: ${VERSION}/|g" "$manifest"
        done

        node scripts/electronWorkflow/verifyDesktopRelease.mjs \
          --release-dir=release \
          --version="$VERSION" \
          --channel="$CHANNEL"

        node scripts/electronWorkflow/createSignedDesktopManifest.mjs \
          --release-dir=release \
          --version="$VERSION" \
          --channel="$CHANNEL"

        test -s "release/${CHANNEL}.json"

        mkdir -p release/versioned
        for manifest in "${CHANNEL}.yml" "${CHANNEL}-mac.yml"; do
          sed "s|url: ${VERSION}/|url: |g" "release/${manifest}" > "release/versioned/${manifest}"
        done

    - name: Upload immutable release files
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_EC2_METADATA_DISABLED: 'true'
        AWS_REGION: ${{ inputs.region }}
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        AWS_SECRET_ACCESS_KEY: ${{ inputs.access-key-secret }}
        BUCKET: ${{ inputs.bucket }}
        CHANNEL: ${{ inputs.channel }}
        ENDPOINT: ${{ inputs.endpoint }}
        KEY_PREFIX: ${{ inputs.key-prefix }}
        PUBLIC_BASE_URL: ${{ inputs.public-base-url }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        aws --version
        aws configure set default.s3.addressing_style virtual

        mapfile -d '' release_files < <(
          find release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' \) \
            -print0
        )
        test "${#release_files[@]}" -gt 0

        for file in "${release_files[@]}"; do
          name="$(basename "$file")"
          object_key="${KEY_PREFIX}/${CHANNEL}/${VERSION}/${name}"
          aws s3 cp "$file" "s3://${BUCKET}/${object_key}" \
            --endpoint-url "$ENDPOINT" \
            --cache-control 'public,max-age=31536000,immutable' \
            --only-show-errors
          aws s3api put-object-acl \
            --bucket "$BUCKET" \
            --key "$object_key" \
            --acl public-read \
            --endpoint-url "$ENDPOINT"
        done

        for manifest in "${CHANNEL}.yml" "${CHANNEL}-mac.yml"; do
          object_key="${KEY_PREFIX}/${CHANNEL}/${VERSION}/${manifest}"
          aws s3 cp "release/versioned/${manifest}" \
            "s3://${BUCKET}/${object_key}" \
            --endpoint-url "$ENDPOINT" \
            --cache-control 'public,max-age=31536000,immutable' \
            --content-type 'application/yaml' \
            --only-show-errors
          aws s3api put-object-acl \
            --bucket "$BUCKET" \
            --key "$object_key" \
            --acl public-read \
            --endpoint-url "$ENDPOINT"
        done

        signed_manifest="${CHANNEL}.json"
        signed_object_key="${KEY_PREFIX}/${CHANNEL}/${VERSION}/${signed_manifest}"
        aws s3 cp "release/${signed_manifest}" \
          "s3://${BUCKET}/${signed_object_key}" \
          --endpoint-url "$ENDPOINT" \
          --cache-control 'public,max-age=31536000,immutable' \
          --content-type 'application/json' \
          --only-show-errors
        aws s3api put-object-acl \
          --bucket "$BUCKET" \
          --key "$signed_object_key" \
          --acl public-read \
          --endpoint-url "$ENDPOINT"

        for file in "${release_files[@]}"; do
          name="$(basename "$file")"
          downloaded="$RUNNER_TEMP/desktop-oss-${name}"
          curl --fail --silent --show-error --location \
            --retry 60 --retry-all-errors --retry-delay 5 \
            --output "$downloaded" \
            "${PUBLIC_BASE_URL}/${CHANNEL}/${VERSION}/${name}"
          cmp --silent "$file" "$downloaded"
          rm -f "$downloaded"
        done

        for manifest in "${CHANNEL}.yml" "${CHANNEL}-mac.yml"; do
          downloaded="$RUNNER_TEMP/desktop-oss-${VERSION}-${manifest}"
          curl --fail --silent --show-error --location \
            --retry 60 --retry-all-errors --retry-delay 5 \
            --output "$downloaded" \
            "${PUBLIC_BASE_URL}/${CHANNEL}/${VERSION}/${manifest}"
          cmp --silent "release/versioned/${manifest}" "$downloaded"
          rm -f "$downloaded"
        done

        signed_manifest="${CHANNEL}.json"
        downloaded="$RUNNER_TEMP/desktop-oss-${VERSION}-${signed_manifest}"
        curl --fail --silent --show-error --location \
          --retry 60 --retry-all-errors --retry-delay 5 \
          --output "$downloaded" \
          "${PUBLIC_BASE_URL}/${CHANNEL}/${VERSION}/${signed_manifest}"
        cmp --silent "release/${signed_manifest}" "$downloaded"
        rm -f "$downloaded"

    - name: Publish current update manifests
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_EC2_METADATA_DISABLED: 'true'
        AWS_REGION: ${{ inputs.region }}
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        AWS_SECRET_ACCESS_KEY: ${{ inputs.access-key-secret }}
        BUCKET: ${{ inputs.bucket }}
        CHANNEL: ${{ inputs.channel }}
        ENDPOINT: ${{ inputs.endpoint }}
        KEY_PREFIX: ${{ inputs.key-prefix }}
        PUBLIC_BASE_URL: ${{ inputs.public-base-url }}
      run: |
        set -euo pipefail

        for manifest in "${CHANNEL}.yml" "${CHANNEL}-mac.yml"; do
          object_key="${KEY_PREFIX}/${CHANNEL}/${manifest}"
          aws s3 cp "release/${manifest}" "s3://${BUCKET}/${object_key}" \
            --endpoint-url "$ENDPOINT" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/yaml' \
            --only-show-errors
          aws s3api put-object-acl \
            --bucket "$BUCKET" \
            --key "$object_key" \
            --acl public-read \
            --endpoint-url "$ENDPOINT"

          curl --fail --silent --show-error --location \
            --retry 60 --retry-all-errors --retry-delay 5 \
            "${PUBLIC_BASE_URL}/${CHANNEL}/${manifest}" >/dev/null
        done


        # The signed JSON is the release switch and must be published last.
        signed_manifest="${CHANNEL}.json"
        object_key="${KEY_PREFIX}/${CHANNEL}/${signed_manifest}"
        aws s3 cp "release/${signed_manifest}" "s3://${BUCKET}/${object_key}" \
          --endpoint-url "$ENDPOINT" \
          --cache-control 'no-cache,no-store,must-revalidate' \
          --content-type 'application/json' \
          --only-show-errors
        aws s3api put-object-acl \
          --bucket "$BUCKET" \
          --key "$object_key" \
          --acl public-read \
          --endpoint-url "$ENDPOINT"
        downloaded="$RUNNER_TEMP/desktop-oss-current-${signed_manifest}"
        curl --fail --silent --show-error --location \
          --retry 60 --retry-all-errors --retry-delay 5 \
          --output "$downloaded" \
          "${PUBLIC_BASE_URL}/${CHANNEL}/${signed_manifest}"
        cmp --silent "release/${signed_manifest}" "$downloaded"
        rm -f "$downloaded"
