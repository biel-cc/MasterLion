apiVersion: batch/v1
kind: Job
metadata:
  name: masterino-market-db-bootstrap
  labels:
    app.kubernetes.io/name: masterino-market-db-bootstrap
    app.kubernetes.io/part-of: masterino
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: masterino-market-db-bootstrap
        app.kubernetes.io/part-of: masterino
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: masterino-acr-fixed
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: boen-registry-vpc.cn-shenzhen.cr.aliyuncs.com/biel_client/paradedb@sha256:87b5800365c938825e31d04ccbf0a6902ad58f81962d0e58c0c9b3188e030b81
          command: ['bash', '-ec']
          args:
            - |
              until pg_isready -h masterino-postgres -U postgres -d postgres; do sleep 2; done
              psql -h masterino-postgres -U postgres -d postgres -v ON_ERROR_STOP=1 \
                --set=market_password="$MARKET_DATABASE_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE masterino_market LOGIN PASSWORD %L', :'market_password')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'masterino_market') \gexec
              SELECT format('ALTER ROLE masterino_market LOGIN PASSWORD %L', :'market_password') \gexec
              SELECT 'CREATE DATABASE masterino_market OWNER masterino_market'
                WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'masterino_market') \gexec
              GRANT ALL PRIVILEGES ON DATABASE masterino_market TO masterino_market;
              SQL
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: masterino-secret
                  key: POSTGRES_PASSWORD
            - name: MARKET_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masterino-market-secret
                  key: MARKET_DATABASE_PASSWORD
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: masterino-market-db-bootstrap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: masterino-market-db-bootstrap
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
