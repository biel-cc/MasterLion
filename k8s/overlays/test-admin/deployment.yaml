apiVersion: v1
kind: Service
metadata:
  name: masterino-admin
  labels:
    app.kubernetes.io/name: masterino-admin
    app.kubernetes.io/part-of: masterino
    masterino.io/environment: test
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: masterino-admin
  ports:
    - name: http
      port: 3020
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masterino-admin
  labels:
    app.kubernetes.io/name: masterino-admin
    app.kubernetes.io/part-of: masterino
    masterino.io/environment: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: masterino-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: masterino-admin
        app.kubernetes.io/part-of: masterino
        masterino.io/environment: test
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: masterino-admin
          image: boen-registry-vpc.cn-shenzhen.cr.aliyuncs.com/biel_client/masterino-admin:unreleased
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          ports:
            - containerPort: 3020
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
