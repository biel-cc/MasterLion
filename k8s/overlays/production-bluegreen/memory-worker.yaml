apiVersion: apps/v1
kind: Deployment
metadata:
  name: masterino-memory-worker
  labels:
    app.kubernetes.io/name: masterino-memory-worker
    app.kubernetes.io/part-of: masterino
    app.kubernetes.io/component: memory-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: masterino-memory-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: masterino-memory-worker
        app.kubernetes.io/part-of: masterino
        app.kubernetes.io/component: memory-worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: masterino-memory-worker
          image: boen-registry-vpc.cn-shenzhen.cr.aliyuncs.com/biel_client/masterino:v1.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: masterino-secret
            - configMapRef:
                name: masterino-config
            - configMapRef:
                name: masterino-memory-config
          env:
            - name: MEMORY_QUEUE_WORKER_ENABLED
              value: '1'
            - name: MEMORY_QUEUE_SCHEDULER_ENABLED
              # Enable only after manual extraction acceptance succeeds.
              value: '0'
            - name: GATEWAY_MANAGER_DISABLED
              value: '1'
            - name: AIHUB_READONLY_DATABASE_URL
              value: ''
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/masterino-onlyboxes-ca.crt
            - name: ALIBABA_CLOUD_ECS_METADATA_DISABLED
              value: 'true'
            - name: ALIBABA_CLOUD_IMDSV1_DISABLE
              value: 'true'
            - name: AWS_EC2_METADATA_DISABLED
              value: 'true'
          ports:
            - containerPort: 3210
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: '1'
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: onlyboxes-ca
              mountPath: /etc/ssl/certs/masterino-onlyboxes-ca.crt
              subPath: onlyboxes-internal-ca.crt
              readOnly: true
      volumes:
        - name: onlyboxes-ca
          configMap:
            name: masterino-onlyboxes-ca
