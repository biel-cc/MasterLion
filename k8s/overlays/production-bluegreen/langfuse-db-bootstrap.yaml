apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-db-bootstrap
  labels:
    app.kubernetes.io/name: langfuse-db-bootstrap
    app.kubernetes.io/part-of: masterino-observability
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-db-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-credential-secret-aggregation
      containers:
        - name: bootstrap
          image: boen-registry-vpc.cn-shenzhen.cr.aliyuncs.com/biel_client/paradedb@sha256:87b5800365c938825e31d04ccbf0a6902ad58f81962d0e58c0c9b3188e030b81
          command: ['/bin/sh', '-ec']
          args:
            - |
              until psql "$MASTERINO_DATABASE_URL" -c 'SELECT 1' >/dev/null; do sleep 2; done
              psql "$MASTERINO_DATABASE_URL" -v ON_ERROR_STOP=1 \
                -v app_password="$LANGFUSE_POSTGRES_APP_PASSWORD" \
                -v migrator_password="$LANGFUSE_POSTGRES_MIGRATOR_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE langfuse_app LOGIN PASSWORD %L', :'app_password')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'langfuse_app') \gexec
              SELECT format('CREATE ROLE langfuse_migrator LOGIN PASSWORD %L', :'migrator_password')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'langfuse_migrator') \gexec
              SELECT format('ALTER ROLE langfuse_app PASSWORD %L', :'app_password') \gexec
              SELECT format('ALTER ROLE langfuse_migrator PASSWORD %L', :'migrator_password') \gexec
              SELECT 'CREATE DATABASE langfuse OWNER langfuse_migrator'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'langfuse') \gexec
              SELECT 'CREATE DATABASE langfuse_shadow OWNER langfuse_migrator'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'langfuse_shadow') \gexec
              REVOKE ALL ON SCHEMA public FROM langfuse_app, langfuse_migrator;
              \connect langfuse
              GRANT USAGE, CREATE ON SCHEMA public TO langfuse_migrator;
              GRANT USAGE ON SCHEMA public TO langfuse_app;
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO langfuse_app;
              GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO langfuse_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE langfuse_migrator IN SCHEMA public
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO langfuse_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE langfuse_migrator IN SCHEMA public
                GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO langfuse_app;
              SQL
          env:
            - name: MASTERINO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: masterino-secret
                  key: DATABASE_URL
            - name: LANGFUSE_POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masterino-secret
                  key: LANGFUSE_POSTGRES_APP_PASSWORD
            - name: LANGFUSE_POSTGRES_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: masterino-secret
                  key: LANGFUSE_POSTGRES_MIGRATOR_PASSWORD
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
