apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: masterino
resources:
  - ../production
replicas:
  - name: masterino
    count: 0
patches:
  - target:
      kind: Ingress
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: unused
