apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: masterino-test
resources:
  - ../../base
  - namespace.yaml
  - storageclass.yaml
  - configmap.yaml
  - memory-worker.yaml
configMapGenerator:
  - name: masterino-memory-config
    envs:
      - memory.properties
generatorOptions:
  disableNameSuffixHash: false
  labels:
    app.kubernetes.io/part-of: masterino
    masterino.io/environment: test
patches:
  - path: memory-config-patch.yaml
  - path: storage-patch.yaml
  - target:
      kind: Deployment
      name: masterino
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ONLYBOXES_JIT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: masterino-onlyboxes-secret
              key: ONLYBOXES_JIT_SIGNING_KEY
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_EXTRA_CA_CERTS
          value: /etc/ssl/certs/masterino-onlyboxes-ca.crt
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: onlyboxes-ca
            mountPath: /etc/ssl/certs/masterino-onlyboxes-ca.crt
            subPath: onlyboxes-internal-ca.crt
            readOnly: true
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: onlyboxes-ca
            configMap:
              name: masterino-onlyboxes-ca
      # Keep the TLS hostname for certificate verification, but resolve it from
      # the Pod hosts file so the sandbox path never depends on DNS.
      - op: add
        path: /spec/template/spec/hostAliases
        value:
          - ip: 10.80.137.220
            hostnames:
              - onlyboxes.internal.bielcrystal.com
replicas:
  - name: masterino
    count: 1
  - name: masterino-memory-worker
    count: 1
