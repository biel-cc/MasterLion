apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: masterino-test
resources:
  - ../../base
  - namespace.yaml
  - storageclass.yaml
  - configmap.yaml
  - device-gateway.yaml
  - memory-worker.yaml
configMapGenerator:
  - name: masterino-memory-config
    envs:
      - memory.properties
generatorOptions:
  disableNameSuffixHash: false
  labels:
    app.kubernetes.io/part-of: masterino
    masterino.io/environment: test
images:
  - name: boen-registry-vpc.cn-shenzhen.cr.aliyuncs.com/biel_client/masterino-device-gateway
    newName: boen-registry-vpc.cn-shenzhen.cr.aliyuncs.com/biel_client/masterino-device-gateway
    digest: sha256:bdb74578c3c8129d898bf628494afe0b7ff22bb0fcb7d62f9f8fdac50d5c463d
patches:
  - path: memory-config-patch.yaml
  - path: storage-patch.yaml
  - target:
      kind: Deployment
      name: masterino
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DEVICE_GATEWAY_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: masterino-device-gateway-secret
              key: SERVICE_TOKEN
replicas:
  - name: masterino
    count: 1
  - name: masterino-memory-worker
    count: 1
