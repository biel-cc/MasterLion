apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: masterino-test
resources:
  - ../../base
  - configmap.yaml
  - memory-worker.yaml
configMapGenerator:
  - name: masterino-memory-config
    envs:
      - memory.properties
generatorOptions:
  disableNameSuffixHash: false
  labels:
    app.kubernetes.io/part-of: masterino
    masterino.io/environment: test
patches:
  - path: memory-config-patch.yaml
  - path: storage-patch.yaml
  - target:
      kind: Deployment
      name: masterino
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SANDBOX_PROVIDER
          value: onlyboxes
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ONLYBOXES_BASE_URL
          value: https://onlyboxes.internal.bielcrystal.com
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ONLYBOXES_JIT_ISSUER
          value: https://mlai-test.bielcrystal.com
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OFFICECLI_ENABLED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ONLYBOXES_JIT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: masterino-onlyboxes-secret
              key: ONLYBOXES_JIT_SIGNING_KEY
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_EXTRA_CA_CERTS
          value: /etc/ssl/certs/masterino-onlyboxes-ca.crt
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: onlyboxes-ca
            mountPath: /etc/ssl/certs/masterino-onlyboxes-ca.crt
            subPath: onlyboxes-internal-ca.crt
            readOnly: true
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: onlyboxes-ca
            configMap:
              name: masterino-onlyboxes-ca
              defaultMode: 420
replicas:
  - name: masterino
    count: 1
  - name: masterino-memory-worker
    count: 1
