apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: masterino-test
resources:
  - ../../base
  - namespace.yaml
  - storageclass.yaml
  - memory-worker.yaml
configMapGenerator:
  - name: masterino-config
    envs:
      - config.properties
generatorOptions:
  disableNameSuffixHash: false
  labels:
    app.kubernetes.io/part-of: masterino
    masterino.io/environment: test
patches:
  - path: storage-patch.yaml
replicas:
  - name: masterino
    count: 1
  - name: masterino-memory-worker
    count: 1
