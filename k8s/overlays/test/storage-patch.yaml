apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: masterino-postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: '2'
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: masterino-test-essd-retain
        resources:
          requests:
            storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: masterino-redis
spec:
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: masterino-test-essd-retain
        resources:
          requests:
            storage: 20Gi
