apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: masterino-test-essd-retain
  labels:
    app.kubernetes.io/part-of: masterino
    masterino.io/environment: test
provisioner: diskplugin.csi.alibabacloud.com
parameters:
  # Prefer ESSD and fall back when the selected ACK node type or zone cannot attach ESSD.
  type: cloud_essd,cloud_ssd,cloud_efficiency
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
