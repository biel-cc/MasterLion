apiVersion: v1
kind: Secret
metadata:
  name: masterlion-market-secret
type: Opaque
stringData:
  # Provision this database/account separately before applying the Secret.
  MARKET_DATABASE_URL: "postgres://masterlion_market:REPLACE@postgres:5432/masterlion_market"
  MARKET_REDIS_URL: "redis://:REPLACE_PASSWORD@redis:6379/0"
  MARKET_TRUSTED_CLIENT_SECRET: "lobehub-market_tcs_REPLACE_WITH_GENERATED_SECRET"
  MARKET_CREDENTIAL_ENCRYPTION_KEY: "REPLACE_WITH_32_PLUS_RANDOM_CHARACTERS"
  MARKET_IMPORT_SIGNING_KEY: "REPLACE_WITH_32_PLUS_RANDOM_CHARACTERS"
  MARKET_RUNNER_INTERNAL_TOKEN: "REPLACE_WITH_32_PLUS_RANDOM_CHARACTERS"
  MARKET_OBJECT_STORAGE_ACCESS_KEY_ID: "REPLACE"
  MARKET_OBJECT_STORAGE_SECRET_ACCESS_KEY: "REPLACE"
  # JSON map: {"provider":{"clientId":"...","clientSecret":"..."}}
  MARKET_OAUTH_CLIENTS_JSON: "{}"
  MARKET_ADMIN_USER_IDS: "REPLACE_WITH_MASTERLION_USER_ID"
