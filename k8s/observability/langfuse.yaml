apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: langfuse-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  labels:
    app.kubernetes.io/name: langfuse-web
    app.kubernetes.io/part-of: masterino-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-web
        app.kubernetes.io/part-of: masterino-observability
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: boen-registry-vpc.cn-shenzhen.cr.aliyuncs.com/biel_client/langfuse-web:3-digest-marker
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: langfuse-config }
            - secretRef: { name: langfuse-secret }
          ports:
            - { name: http, containerPort: 3000 }
          resources:
            requests: { cpu: '1', memory: 2Gi }
            limits: { cpu: '2', memory: 4Gi }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  labels:
    app.kubernetes.io/name: langfuse-worker
    app.kubernetes.io/part-of: masterino-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-worker
        app.kubernetes.io/part-of: masterino-observability
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: boen-registry-vpc.cn-shenzhen.cr.aliyuncs.com/biel_client/langfuse-worker:3-digest-marker
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: langfuse-config }
            - secretRef: { name: langfuse-secret }
          ports:
            - { name: health, containerPort: 3030 }
          resources:
            requests: { cpu: '1', memory: 2Gi }
            limits: { cpu: '2', memory: 4Gi }
          startupProbe:
            tcpSocket: { port: health }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: health }
            periodSeconds: 30
