apiVersion: batch/v1
kind: CronJob
metadata:
  name: clickhouse-backup-daily
spec:
  schedule: '15 2 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: clickhouse-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: backup
              image: boen-registry-vpc.cn-shenzhen.cr.aliyuncs.com/biel_client/clickhouse-backup:2.7.0-digest-marker
              command: ['/bin/sh', '-ec']
              args:
                - |
                  name="daily-$(date -u +%Y%m%dT%H%M%SZ)"
                  base="$(clickhouse-backup list remote latest | awk 'NR == 1 { print $1 }')"
                  if [ -n "$base" ] && [ "$base" != "name" ]; then
                    clickhouse-backup create_remote --diff-from-remote="$base" "$name"
                  else
                    clickhouse-backup create_remote "$name"
                  fi
              envFrom:
                - secretRef: { name: langfuse-secret }
              env:
                - { name: CLICKHOUSE_HOST, value: clickhouse }
                - { name: CLICKHOUSE_PORT, value: '9000' }
                - { name: CLICKHOUSE_USERNAME, value: langfuse }
                - { name: REMOTE_STORAGE, value: s3 }
                - { name: S3_ENDPOINT, value: https://oss-cn-shenzhen.aliyuncs.com }
                - { name: S3_REGION, value: cn-shenzhen }
                - { name: S3_BUCKET, value: masterino-langfuse-backups-1574541762075655 }
                - { name: S3_PATH, value: daily }
                - { name: BACKUPS_TO_KEEP_REMOTE, value: '30' }
                - { name: BACKUPS_TO_KEEP_LOCAL, value: '-1' }
              resources:
                requests: { cpu: 250m, memory: 256Mi }
                limits: { cpu: '1', memory: 1Gi }
---
